trigger:
- Master

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'healthcare-app'
  tag: 'latest'

  acrServiceConnection: 'acr-Docker-healthcare'
  azureServiceConnection: 'azure-rm-healthcare'

  sonarServiceConnection: 'sonarqube_project1'
  sonarProjectKey: 'healthcare_app_project1'
  sonarProjectName: 'Healthcare app'

stages:

# =====================================================
# STAGE 1 - VALIDATE
# =====================================================
- stage: Validate
  displayName: 'Validate Code'

  jobs:
  - job: Validation
    displayName: 'Lint Test SonarQube'

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install flake8 pytest
      displayName: 'Install Dependencies'

    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube'
      inputs:
        SonarQube: 'sonarqube-project1'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'healthcare_app_project1'
        cliProjectName: 'Healthcare App'

    - script: |
        flake8 app/
      displayName: 'Lint Check'

    - script: |
        export PYTHONPATH=$(Build.SourcesDirectory)
        pytest tests/ -v
      displayName: 'Run Unit Tests'

    - task: SonarQubeAnalyze@7
      displayName: 'Run SonarQube Analysis'

    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Results'
      inputs:
        pollingTimeoutSec: '300'

# =====================================================
# STAGE 2 - BUILD DOCKER IMAGE
# =====================================================
- stage: Build
  displayName: 'Build Docker Image'
  dependsOn: Validate

  jobs:
  - job: DockerBuild
    displayName: 'Docker Build'

    steps:

    - checkout: self

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        repository: $(imageName)
        Dockerfile: 'app/Dockerfile'
        tags: |
          $(tag)

    - script: |
        docker images
      displayName: 'Verify Docker Image'

# =====================================================
# STAGE 3 - TRIVY SECURITY SCAN
# =====================================================
- stage: SecurityScan
  displayName: 'Security Scan'
  dependsOn: Build

  jobs:
  - job: TrivyScan
    displayName: 'Container Security Scan'

    steps:

    - script: |
        sudo apt-get update
        sudo apt-get install wget -y

        wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

        trivy --version
      displayName: 'Install Trivy'

    - script: |
        trivy image --exit-code 0 $(imageName):$(tag)
      displayName: 'Generate Trivy Report'

    - script: |
        trivy image --exit-code 1 --severity CRITICAL $(imageName):$(tag)
      displayName: 'Fail on Critical Vulnerabilities'

# =====================================================
# STAGE 4 - PUSH IMAGE TO ACR
# =====================================================
- stage: PushToACR
  displayName: 'Push Image To ACR'
  dependsOn: SecurityScan

  jobs:
  - job: PushImage
    displayName: 'Push Docker Image'

    steps:

    - checkout: self

    - task: Docker@2
      displayName: 'Build and Push Image'
      inputs:
        command: buildAndPush
        containerRegistry: 'acr-Docker-healthcare'
        repository: $(imageName)
        Dockerfile: 'app/Dockerfile'
        tags: |
          $(tag)